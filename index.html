    <meta name="theme-color" content="#ffffff" />

    <title>E-books</title>
    <meta name="application-name" content="E-books" />
    <meta name="apple-mobile-web-app-title" content="E-books" />
    <meta
      name="description"
      content="E-books: leitor de EPUB pessoal, com seus livros, progresso e grifos no navegador e Google Drive opcional. E-books is a personal EPUB reader with optional Google Drive."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="E-books" />
    <meta property="og:title" content="E-books" />

      property="og:description"
      content="Leitor de EPUB pessoal. A personal EPUB reader."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 16px/1.6 system-ui, sans-serif">
        <h1>E-books</h1>
        <p>
          O E-books é um leitor de EPUB pessoal: importe seus livros, leia com as
          cores, a fonte e o espaçamento que preferir, grife trechos e escreva
          anotações. Este aplicativo precisa de JavaScript para funcionar.
        </p>
        <p>
          Se você conectar a sua conta Google (opcional), o E-books usa o Google
          Drive, com acesso restrito aos arquivos que ele mesmo cria, para
          guardar seus livros, progresso e grifos e levar a leitura de um
          aparelho para outro.
        </p>
        <p>
          E-books is a personal EPUB reader: import your books, read with your
          own colors, font and spacing, highlight passages and take notes. It
          needs JavaScript to run. If you connect your Google account
          (optional), E-books uses Google Drive, restricted to the files it
          creates itself, to keep your books, reading progress and highlights
          and carry your reading from one device to another.
        </p>
        <p><a href="/privacy">Política de privacidade · Privacy policy</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
